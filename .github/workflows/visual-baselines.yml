name: visual-baseline-candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture candidate baselines with accessibility checks
        run: npx playwright test tests/e2e/visual-accessibility.spec.ts --grep "desktop control room|mobile engagement journey|mobile AI Partner" --update-snapshots=all
      - name: Verify candidates against all user journeys
        run: npm run test:e2e
      - name: Upload candidates for manual review
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-linux
          path: tests/e2e/visual-accessibility.spec.ts-snapshots/linux/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload capture report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-baseline-capture-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
