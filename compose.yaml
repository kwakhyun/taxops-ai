name: taxops-ai

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: taxops
      POSTGRES_USER: taxops_owner
      POSTGRES_PASSWORD: taxops_owner_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxops_owner -d taxops"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - taxops-db:/var/lib/postgresql/data
      - ./infra/docker/init:/docker-entrypoint-initdb.d:ro

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: taxops_minio
      MINIO_ROOT_PASSWORD: taxops_minio_dev_only
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - taxops-objects:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 taxops_minio taxops_minio_dev_only &&
        mc mb --ignore-existing local/taxops-private &&
        mc version enable local/taxops-private &&
        mc anonymous set none local/taxops-private

  clamav:
    image: clamav/clamav-debian:1.4
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgres://taxops_owner:taxops_owner_dev_only@db:5432/taxops
    depends_on:
      db:
        condition: service_healthy

  seed:
    image: pgvector/pgvector:pg16
    environment:
      PGPASSWORD: taxops_owner_dev_only
    volumes:
      - ./drizzle/seed.sql:/seed.sql:ro
    command:
      [
        "psql",
        "-h",
        "db",
        "-U",
        "taxops_owner",
        "-d",
        "taxops",
        "-v",
        "ON_ERROR_STOP=1",
        "-f",
        "/seed.sql",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully

  contract-test:
    build:
      context: .
      target: contract-test
    environment:
      DATABASE_URL: postgres://taxops_app:taxops_app_dev_only@db:5432/taxops
      REVIEW_DATABASE_URL: postgres://taxops_reviewer:taxops_reviewer_dev_only@db:5432/taxops
      TEST_DATABASE_OWNER_URL: postgres://taxops_owner:taxops_owner_dev_only@db:5432/taxops
      TEST_WORKER_DATABASE_URL: postgres://taxops_worker:taxops_worker_dev_only@db:5432/taxops
      OBJECT_BUCKET: taxops-private
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      AWS_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: taxops_minio
      AWS_SECRET_ACCESS_KEY: taxops_minio_dev_only
      AI_PROVIDER_DATA_REGION: ap-northeast-2
      RAG_MIN_SCORE: "0"
    depends_on:
      seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  reviewer:
    build:
      context: .
      target: reviewer
    environment:
      REVIEW_DATABASE_URL: postgres://taxops_reviewer:taxops_reviewer_dev_only@db:5432/taxops
      REVIEW_SERVICE_SHARED_SECRET: ${REVIEW_SERVICE_SHARED_SECRET:-dGF4b3BzLXJldmlldy1zZXJ2aWNlLWRldi1vbmx5LWtleSE}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://identity.example.invalid}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-https://identity.example.invalid/.well-known/jwks.json}
      OIDC_REVIEW_AUDIENCE: ${OIDC_REVIEW_AUDIENCE:-taxops-review-api}
      OIDC_REVIEW_SCOPE: ${OIDC_REVIEW_SCOPE:-review:decide}
      OIDC_REVIEW_REQUIRED_ACR: ${OIDC_REVIEW_REQUIRED_ACR:-urn:taxops:acr:mfa}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-taxops-local}
      APPROVAL_TOKEN_SECRET: ${APPROVAL_TOKEN_SECRET:-dGF4b3BzLWFwcHJvdmFsLXRva2VuLWRldi1vbmx5LWtleSE}
      PORT: "3100"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3100/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://taxops_app:taxops_app_dev_only@db:5432/taxops
      REVIEW_SERVICE_URL: http://reviewer:3100
      REVIEW_SERVICE_ALLOWED_HOST: reviewer
      REVIEW_SERVICE_ALLOW_ENCRYPTED_HTTP: "true"
      REVIEW_SERVICE_SHARED_SECRET: ${REVIEW_SERVICE_SHARED_SECRET:-dGF4b3BzLXJldy1zZXJ2aWNlLWRldi1vbmx5LWtleSE}
      AUTH_MODE: oidc
      APP_BASE_URL: ${APP_BASE_URL:-http://127.0.0.1:3000}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://identity.example.invalid}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-taxops-local}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-https://identity.example.invalid/.well-known/jwks.json}
      OIDC_AUTHORIZATION_URL: ${OIDC_AUTHORIZATION_URL:-https://identity.example.invalid/oauth2/authorize}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-https://identity.example.invalid/oauth2/token}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-taxops-local}
      OIDC_REVIEW_AUDIENCE: ${OIDC_REVIEW_AUDIENCE:-taxops-review-api}
      OIDC_REVIEW_RESOURCE_PARAMETER: ${OIDC_REVIEW_RESOURCE_PARAMETER:-resource}
      OIDC_REVIEW_SCOPE: ${OIDC_REVIEW_SCOPE:-review:decide}
      OIDC_REVIEW_REQUIRED_ACR: ${OIDC_REVIEW_REQUIRED_ACR:-urn:taxops:acr:mfa}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-replace-with-a-real-oidc-client-secret}
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-at-least-32-random-characters}
      OBJECT_BUCKET: taxops-private
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      AWS_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: taxops_minio
      AWS_SECRET_ACCESS_KEY: taxops_minio_dev_only
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      AI_MODEL_ID: ${AI_MODEL_ID:-openai/gpt-5.6-sol}
      AI_VERIFIER_MODEL_ID: ${AI_VERIFIER_MODEL_ID:-openai/gpt-5.6-terra}
      AI_PROVIDER_DATA_REGION: ${AI_PROVIDER_DATA_REGION:-ap-northeast-2}
      PII_DLP_URL: ${PII_DLP_URL:-}
      PII_DLP_TOKEN: ${PII_DLP_TOKEN:-}
      PII_DLP_DATA_REGION: ${PII_DLP_DATA_REGION:-ap-northeast-2}
      PROMPT_INJECTION_CLASSIFIER_URL: ${PROMPT_INJECTION_CLASSIFIER_URL:-}
      PROMPT_INJECTION_CLASSIFIER_TOKEN: ${PROMPT_INJECTION_CLASSIFIER_TOKEN:-}
      PROMPT_INJECTION_CLASSIFIER_DATA_REGION: ${PROMPT_INJECTION_CLASSIFIER_DATA_REGION:-ap-northeast-2}
      PROMPT_INJECTION_CLASSIFIER_ALLOWED_HOSTS: ${PROMPT_INJECTION_CLASSIFIER_ALLOWED_HOSTS:-injection-classifier.service.internal}
      PROMPT_INJECTION_CLASSIFIER_THRESHOLD: ${PROMPT_INJECTION_CLASSIFIER_THRESHOLD:-0.5}
      TAXOPS_LOCAL_STACK: ${TAXOPS_LOCAL_STACK:-true}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-localhost,127.0.0.1}
    depends_on:
      seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      reviewer:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://taxops_worker:taxops_worker_dev_only@db:5432/taxops
      OBJECT_BUCKET: taxops-private
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      AWS_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: taxops_minio
      AWS_SECRET_ACCESS_KEY: taxops_minio_dev_only
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      AI_EMBEDDING_MODEL_ID: ${AI_EMBEDDING_MODEL_ID:-openai/text-embedding-3-small}
      AI_PROVIDER_DATA_REGION: ${AI_PROVIDER_DATA_REGION:-ap-northeast-2}
      PII_DLP_URL: ${PII_DLP_URL:-}
      PII_DLP_TOKEN: ${PII_DLP_TOKEN:-}
      PII_DLP_DATA_REGION: ${PII_DLP_DATA_REGION:-ap-northeast-2}
      PROMPT_INJECTION_CLASSIFIER_URL: ${PROMPT_INJECTION_CLASSIFIER_URL:-}
      PROMPT_INJECTION_CLASSIFIER_TOKEN: ${PROMPT_INJECTION_CLASSIFIER_TOKEN:-}
      PROMPT_INJECTION_CLASSIFIER_DATA_REGION: ${PROMPT_INJECTION_CLASSIFIER_DATA_REGION:-ap-northeast-2}
      PROMPT_INJECTION_CLASSIFIER_ALLOWED_HOSTS: ${PROMPT_INJECTION_CLASSIFIER_ALLOWED_HOSTS:-injection-classifier.service.internal}
      PROMPT_INJECTION_CLASSIFIER_THRESHOLD: ${PROMPT_INJECTION_CLASSIFIER_THRESHOLD:-0.5}
      TAXOPS_LOCAL_STACK: ${TAXOPS_LOCAL_STACK:-true}
      DOCUMENT_PROCESSOR_URL: ${DOCUMENT_PROCESSOR_URL:-}
      DOCUMENT_PROCESSOR_TOKEN: ${DOCUMENT_PROCESSOR_TOKEN:-}
      DOCUMENT_PROCESSOR_DATA_REGION: ${DOCUMENT_PROCESSOR_DATA_REGION:-ap-northeast-2}
      DOCUMENT_PROCESSOR_ALLOWED_HOSTS: ${DOCUMENT_PROCESSOR_ALLOWED_HOSTS:-document-processor.internal}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      NOTIFICATION_WEBHOOK_SECRET: ${NOTIFICATION_WEBHOOK_SECRET:-}
      REQUIRE_NOTIFICATION_WEBHOOK: ${REQUIRE_NOTIFICATION_WEBHOOK:-false}
    depends_on:
      seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    restart: unless-stopped

volumes:
  taxops-db:
  taxops-objects:
