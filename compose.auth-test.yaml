# Disposable loopback-only database. No existing volumes or cloud credentials are used.
name: taxops-auth-test
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: taxops_auth_test
      POSTGRES_USER: taxops_owner
      POSTGRES_PASSWORD: taxops_auth_test_only
    ports:
      - "127.0.0.1:55437:5432"
    command:
      ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30"]
    mem_limit: 384m
    cpus: 0.75
    tmpfs:
      - /var/lib/postgresql/data:size=256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxops_owner -d taxops_auth_test"]
      interval: 2s
      timeout: 3s
      retries: 30
